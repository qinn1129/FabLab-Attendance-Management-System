name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # The frontend just needs some non-empty value here so
        # isApiConfigured() returns true — every API call in these tests is
        # intercepted by mockApi() in tests/client.spec.ts, so nothing ever
        # actually reaches this URL.
        VITE_API_URL: http://127.0.0.1:4000
        VITE_WEBAPP_SECRET: playwright-test-secret
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
